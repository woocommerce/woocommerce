name: 'PHPStan Analysis'

on:
    pull_request:
        paths:
            - 'plugins/woocommerce/**/*.php'
            - 'plugins/woocommerce/composer.json'
            - 'plugins/woocommerce/composer.lock'
            - 'plugins/woocommerce/phpstan.neon'
            - 'plugins/woocommerce/phpstan-baseline.neon'
    push:
        paths:
            - 'plugins/woocommerce/**/*.php'
            - 'plugins/woocommerce/composer.json'
            - 'plugins/woocommerce/composer.lock'
            - 'plugins/woocommerce/phpstan.neon'
            - 'plugins/woocommerce/phpstan-baseline.neon'
        branches:
            - 'trunk'
            - 'release/*'

concurrency:
    group: phpstan-${{ github.event_name == 'push' && github.run_id || github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

env:
    FORCE_COLOR: 1

jobs:
    phpstan:
        name: 'PHPStan Analysis'
        runs-on: ubuntu-latest
        steps:
            - uses: 'actions/checkout@v4'
              name: 'Checkout'

            - uses: './.github/actions/setup-woocommerce-monorepo'
              id: 'setup-monorepo'
              with:
                  install: '@woocommerce/plugin-woocommerce...'
                  pull-package-deps: '@woocommerce/plugin-woocommerce'
                  php-version: '7.4'

            - name: 'Create tmp directory'
              working-directory: plugins/woocommerce
              run: mkdir -p tmp

            - name: 'Restore PHPStan result cache'
              uses: actions/cache/restore@v4
              with:
                  path: plugins/woocommerce/tmp
                  key: phpstan-result-cache-${{ github.run_id }}
                  restore-keys: |
                      phpstan-result-cache-

            - name: 'Run PHPStan'
              working-directory: plugins/woocommerce
              run: pnpm --filter='@woocommerce/plugin-woocommerce' phpstan:baseline

            - name: 'Check baselines'
              if: ${{ github.event_name == 'pull_request' }}
              working-directory: plugins/woocommerce
              run: |
                  BASELINE_FILE="phpstan-baseline.neon"

                  # Fetch the base branch for comparison
                  BASE_SHA="${{ github.event.pull_request.base.sha }}"
                  git fetch origin "$BASE_SHA" --depth=1

                  # Check if baseline file exists and has changed (ignoring whitespace-only changes)
                  if ! git diff --exit-code --ignore-all-space "$BASE_SHA" -- "$BASELINE_FILE"; then
                      # Function to count total errors in baseline (sum of all count fields)
                      count_errors() {
                          local file="$1"
                          if [[ ! -f "$file" ]] || [[ "$file" == "/dev/null" ]]; then
                              echo 0
                              return
                          fi
                          # Extract all count values and sum them
                          # Handle both spaces and tabs for indentation
                          grep -E '^[[:space:]]+count:[[:space:]]*[0-9]+' "$file" 2>/dev/null | sed -E 's/^[[:space:]]+count:[[:space:]]*//' | awk '{sum+=$1} END {print sum+0}'
                      }
                      
                      # Get base version of baseline
                      BASE_BASELINE=$(mktemp)
                      if git show "$BASE_SHA:$BASELINE_FILE" > "$BASE_BASELINE" 2>/dev/null; then
                          BASE_COUNT=$(count_errors "$BASE_BASELINE")
                      else
                          BASE_COUNT=0
                      fi
                      rm -f "$BASE_BASELINE"
                      
                      # Count errors in current baseline
                      CURRENT_COUNT=$(count_errors "$BASELINE_FILE")
                      
                      # Calculate difference
                      DIFF=$((CURRENT_COUNT - BASE_COUNT))
                      
                      if [[ $DIFF -lt 0 ]]; then
                          # Baseline decreased - good news!
                          DECREASE=$((DIFF * -1))
                          echo "::notice file=$BASELINE_FILE::PHPStan baseline decreased by $DECREASE errors (from $BASE_COUNT to $CURRENT_COUNT). Great work! 🎉"
                      elif [[ $DIFF -eq 0 ]]; then
                          # Baseline unchanged but file changed (maybe errors were reorganized)
                          echo "::notice file=$BASELINE_FILE::PHPStan baseline changed but error count remained the same ($CURRENT_COUNT errors)."
                      else
                          # Baseline increased - show the errors
                          echo "::error file=$BASELINE_FILE::PHPStan baseline increased by $DIFF errors (from $BASE_COUNT to $CURRENT_COUNT). Please review the new errors below."
                          echo ""
                          echo "## New errors added to baseline:"
                          echo ""
                          # Show the diff of what was added, focusing on new error entries
                          git diff "$BASE_SHA" -- "$BASELINE_FILE" | grep -A 5 -E '^\+[[:space:]]*message:' | head -150
                          echo ""
                          echo "To update the baseline, run: \`composer phpstan:baseline\`"
                          exit 1
                      fi
                  fi

            - name: 'Save PHPStan result cache'
              uses: actions/cache/save@v4
              if: ${{ !cancelled() }}
              with:
                  path: plugins/woocommerce/tmp
                  key: phpstan-result-cache-${{ github.run_id }}
