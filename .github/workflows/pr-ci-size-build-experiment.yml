name: 'PR experiment: Compressed Size duplicate build'

on:
  pull_request:
    types: [opened]
    paths:
      - '.github/workflows/pr-ci-size-build-experiment.yml'

permissions:
  contents: read

concurrency:
  group: pr-size-build-experiment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HEAD_SHA: 918de73f8a3b3d81f9b1fa61aa3716489e5dcf56
  BASE_SHA: 970a1087dd2747f078964aabf4cfdd177081cedc
  ACTION_SHA: f322c295dde06a1cb7ccaef105732dd8a726d1d9
  FORCE_COLOR: '1'
  CI: 'true'
  BROWSERSLIST_IGNORE_OLD_DATA: 'true'

jobs:
  measure:
    name: 'Compressed Size: ${{ matrix.arm }}'
    if: ${{ github.repository == 'woocommerce/woocommerce' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/pr-ci-speedups' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [baseline, skip-setup-build, skip-setup-build-blobless]
    env:
      ARM: ${{ matrix.arm }}
    steps:
      - name: 'Checkout the identical historical PR head'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: 'Setup pnpm as in Compressed Size'
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          cache: false

      - name: 'Setup Node as in Compressed Size'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: ''
          package-manager-cache: false

      - name: 'Identify pnpm downloads'
        run: |
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"
          echo "TRIAL=$RUNNER_TEMP/size-build-experiment" >> "$GITHUB_ENV"

      - name: 'Restore pnpm downloads without saving'
        id: pnpm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ runner.os }}-pnpm-@woocommerce/plugin-woocommerce-build:full-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-@woocommerce/plugin-woocommerce-build:full-

      - name: 'Restore Node build cache without saving'
        id: node-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./node_modules/.cache
          key: ${{ runner.os }}-node-cache-@woocommerce/plugin-woocommerce-build:full-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-node-cache-@woocommerce/plugin-woocommerce-build:full-

      - name: 'Restore Composer downloads without saving'
        id: composer-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-@woocommerce/plugin-woocommerce-build:full-${{ hashFiles('packages/*/*/composer.lock', 'plugins/*/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-@woocommerce/plugin-woocommerce-build:full-

      - name: 'Prepare only pinned local build and measurement code'
        shell: bash
        run: |
          mkdir -p "$TRIAL/action" "$TRIAL/results"
          curl --fail --silent --show-error --location "https://api.github.com/repos/preactjs/compressed-size-action/tarball/$ACTION_SHA" | tar -xz --strip-components=1 -C "$TRIAL/action"
          (cd "$TRIAL/action" && npm ci --ignore-scripts --no-audit --no-fund)
          cp "$TRIAL/action/src/utils.js" "$TRIAL/action/utils.mjs"
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const root = process.env.TRIAL + '/action/';
          const source = fs.readFileSync(root + 'src/index.js', 'utf8');
          function unique(text) {
            const i = source.indexOf(text);
            if (i < 0 || i !== source.lastIndexOf(text)) throw new Error('Unexpected pinned source: ' + text);
            return i;
          }
          let body = source.slice(unique('\tconst plugin = new SizePlugin({'), unique('\tlet outputRawMarkdown = false;'));
          if (/octokit|createCheck|commentInfo|getOctokit/.test(body)) throw new Error('Reporting entered the measurement body');
          function replaceOnce(before, after) {
            if (!body.includes(before) || body.indexOf(before) !== body.lastIndexOf(before)) throw new Error('Unexpected instrumented source: ' + before);
            body = body.replace(before, after);
          }
          replaceOnce('git fetch -n origin ${baseRef}:${baseRef}', 'git fetch -n origin ${baseSha}:${baseRef}');
          replaceOnce('const newSizes = await plugin.readFromDisk(cwd);', "const newSizes = await plugin.readFromDisk(cwd);\nawait capture(plugin, cwd, newSizes, 'head');");
          replaceOnce('const oldSizes = await plugin.readFromDisk(cwd);', "const oldSizes = await plugin.readFromDisk(cwd);\nawait capture(plugin, cwd, oldSizes, 'base');");
          const inputs = {
            compression: 'gzip',
            pattern: './{packages/js/!(*e2e*|*internal*|*test*|*plugin*|*create*)/{build,build-style},plugins/woocommerce/assets/{client/{admin,blocks,routes},js,css}}/**/*.{js,css}',
            'install-script': 'pnpm install --filter="@woocommerce/plugin-woocommerce..." --frozen-lockfile',
            'build-script': '--filter="@woocommerce/plugin-woocommerce" build',
            'clean-script': '--if-present clean:build',
            'minimum-change-threshold': '100', 'omit-unchanged': 'true',
            'collapse-unchanged': 'true', 'show-total': 'true', 'sort-by': 'Filename:asc',
          };
          fs.writeFileSync(root + 'inputs.json', JSON.stringify(inputs, null, 2));
          const prelude = `
          import fs from 'node:fs';
          import {startGroup, endGroup} from '@actions/core';
          import {exec as actionExec} from '@actions/exec';
          import {SizePlugin} from '@rschristian/size-plugin';
          import {getPackageManagerAndInstallScript, diffTable, toBool, stripHash, getSortOrder} from './utils.mjs';
          import {capture} from './capture.mjs';
          import {beforeCommand, afterCommand, finishGitObservation} from './git-observe.mjs';
          const inputs = JSON.parse(fs.readFileSync(new URL('./inputs.json', import.meta.url)));
          const getInput = name => inputs[name] || '';
          const baseSha = process.env.BASE_SHA;
          const baseRef = 'size-experiment-base';
          const timings = [];
          const actionStarted = performance.now();
          async function exec(command) {
            const outerStart = performance.now();
            const prepared = beforeCommand(command);
            const start = performance.now();
            const startedAt = Date.now();
            let succeeded = false;
            try {
              const result = await actionExec(prepared.command);
              succeeded = true;
              return result;
            }
            finally {
              const endedAt = Date.now();
              const seconds = (performance.now() - start) / 1000;
              afterCommand(prepared, succeeded);
              timings.push({command: prepared.command, phase: prepared.phase, seconds, startedAt, endedAt,
                observationAndConfigSeconds: (performance.now() - outerStart) / 1000 - seconds});
              fs.writeFileSync(process.env.TRIAL + '/results/action-timings.json', JSON.stringify(timings, null, 2));
            }
          }
          `;
          const epilogue = `
          fs.writeFileSync(process.env.TRIAL + '/results/diff.json', JSON.stringify(diff.sort((a,b) => a.filename.localeCompare(b.filename)), null, 2));
          fs.writeFileSync(process.env.TRIAL + '/results/size-report.md', markdownDiff + '\\n');
          finishGitObservation(timings);
          fs.writeFileSync(process.env.TRIAL + '/results/action-total.json', JSON.stringify({seconds: (performance.now() - actionStarted) / 1000}));
          `;
          fs.writeFileSync(root + 'measure.mjs', prelude + body + epilogue);
          const pluginSetup = source.slice(unique('\tconst plugin = new SizePlugin({'), unique('\tconst buildScript = getInput'));
          fs.writeFileSync(root + 'initial.mjs', prelude + pluginSetup + "await capture(plugin, process.cwd(), await plugin.readFromDisk(process.cwd()), 'setup-head');\n");
          fs.writeFileSync(process.env.TRIAL + '/results/action-source-sha256.txt', crypto.createHash('sha256').update(source).digest('hex') + '\n');
          fs.copyFileSync(root + 'measure.mjs', process.env.TRIAL + '/results/measurement-source.mjs');
          NODE
          cat > "$TRIAL/action/capture.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          export async function capture(plugin, cwd, sizes, label) {
            const entries = Object.entries(sizes).sort(([a], [b]) => a.localeCompare(b));
            const matched = [...fs.globSync(plugin.options.pattern, {
              cwd, exclude: plugin.options.exclude ? [plugin.options.exclude] : undefined,
            })].sort();
            console.log(JSON.stringify({label, cwd, pattern: plugin.options.pattern, matched: matched.length, measured: entries.length}));
            if (!entries.length) throw new Error('Empty size measurement: ' + label);
            if (JSON.stringify(matched) !== JSON.stringify(entries.map(([name]) => name).sort())) {
              throw new Error('The size plugin omitted matched files: ' + label);
            }
            const files = [];
            for (const [file, gzip] of entries) {
              const bytes = fs.readFileSync(path.join(cwd, file));
              files.push({file, raw: bytes.length, gzip, sha256: crypto.createHash('sha256').update(bytes).digest('hex')});
            }
            const target = process.env.TRIAL + '/results/' + label + '.json';
            fs.writeFileSync(target, JSON.stringify(files, null, 2) + '\n');
            const reread = Object.entries(await plugin.readFromDisk(cwd)).sort(([a], [b]) => a.localeCompare(b));
            if (JSON.stringify(entries) !== JSON.stringify(reread)) throw new Error('Unstable size reread: ' + label);
            for (const file of files) {
              const hash = crypto.createHash('sha256').update(fs.readFileSync(path.join(cwd, file.file))).digest('hex');
              if (hash !== file.sha256) throw new Error('Asset changed while measuring: ' + file.file);
            }
            console.log(label + ': ' + files.length + ' files; stable repeated reads');
          }
          NODE
          node --check "$TRIAL/action/measure.mjs"
          node --check "$TRIAL/action/initial.mjs"
          node --check "$TRIAL/action/capture.mjs"

      - name: 'Prepare local Git history and deferred-fetch observation'
        shell: bash
        run: |
          cat > "$TRIAL/action/git-observe.mjs" <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import crypto from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const trial = process.env.TRIAL;
          const base = process.env.BASE_SHA;
          const ref = 'size-experiment-base';
          const blobless = process.env.ARM === 'skip-setup-build-blobless';
          const trace = path.join(trial, 'git-trace.json');
          process.env.GIT_TRACE2_EVENT = trace;
          const samples = [];
          let baseCheckout = false;
          let fetched = false;
          function git(...args) {
            const env = {...process.env, GIT_NO_LAZY_FETCH: '1'};
            delete env.GIT_TRACE2_EVENT;
            return execFileSync('git', args, {encoding: 'utf8', env, maxBuffer: 64 * 1024 * 1024}).trim();
          }
          function config(key) {
            try { return git('config', '--local', '--get', key); }
            catch (error) { if (error.status === 1) return null; throw error; }
          }
          function sample(label) {
            const pack = path.resolve(git('rev-parse', '--git-path', 'objects/pack'));
            const files = fs.readdirSync(pack);
            const shallowPath = path.resolve(git('rev-parse', '--git-path', 'shallow'));
            const entry = {
              label, gitVersion: git('--version'), head: git('rev-parse', 'HEAD'), tree: git('rev-parse', 'HEAD^{tree}'),
              shallow: fs.existsSync(shallowPath) ? fs.readFileSync(shallowPath, 'utf8') : '',
              packBytes: files.filter(name => name.endsWith('.pack')).reduce((sum, name) => sum + fs.statSync(path.join(pack, name)).size, 0),
              packs: files.filter(name => name.endsWith('.pack')).length,
              promisorMarkers: files.filter(name => name.endsWith('.promisor')).length,
              objects: git('count-objects', '-v'),
              promisor: config('remote.origin.promisor'), filter: config('remote.origin.partialclonefilter'),
            };
            samples.push(entry);
            fs.writeFileSync(path.join(trial, 'results/git-observations.json'), JSON.stringify(samples, null, 2));
            if (entry.shallow !== samples[0].shallow) throw new Error('Shallow boundary changed: ' + label);
            return entry;
          }
          export function beforeCommand(command) {
            let phase = 'reset';
            const isBaseFetch = command === `git fetch -n origin ${base}:${ref}`;
            if (isBaseFetch) {
              phase = 'base-fetch';
              sample('before-fetch');
              if (blobless) {
                git('config', '--local', 'remote.origin.promisor', 'true');
                git('config', '--local', 'remote.origin.partialclonefilter', 'blob:none');
                command = `git fetch -n --filter=blob:none origin ${base}:${ref}`;
              }
            } else if (command === `git reset --hard ${ref}`) phase = 'base-checkout';
            else if (command.includes('clean:build')) phase = 'base-clean';
            else if (command.startsWith('pnpm install ')) phase = baseCheckout ? 'base-install' : 'head-install';
            else if (command.startsWith('pnpm run ')) phase = baseCheckout ? 'base-build' : 'head-build';
            return {command, phase, isBaseFetch};
          }
          export function afterCommand(prepared, succeeded) {
            if (!succeeded) return;
            if (prepared.isBaseFetch) {
              const state = sample('after-fetch');
              const parents = git('rev-list', '--parents', base).split('\n').filter(Boolean).sort();
              if (!parents.length) throw new Error('Empty base commit-parent manifest');
              const history = {
                base: git('rev-parse', `${base}^{commit}`), tree: git('rev-parse', `${base}^{tree}`),
                commits: parents.length, parentsSha256: crypto.createHash('sha256').update(parents.join('\n') + '\n').digest('hex'),
                shallowBefore: samples[0].shallow, shallowAfter: state.shallow,
              };
              if (history.base !== base) throw new Error('Incorrect fetched base');
              fs.writeFileSync(path.join(trial, 'results/base-history.json'), JSON.stringify(history, null, 2));
              fetched = true;
            } else if (prepared.phase === 'base-checkout') {
              baseCheckout = true;
              if (sample('after-base-checkout').head !== base) throw new Error('Incorrect checked-out base');
            } else if (prepared.phase === 'base-build') {
              if (sample('after-base-build').head !== base) throw new Error('Build moved the base commit');
            }
          }
          export function finishGitObservation(timings) {
            const finishStarted = performance.now();
            if (!fetched || !baseCheckout) throw new Error('Exact base fetch/checkout was not observed');
            if (sample('after-measurement').head !== base) throw new Error('Measurement moved the base commit');
            if (!fs.existsSync(trace)) throw new Error('Missing Git trace evidence');
            const processes = new Map();
            for (const line of fs.readFileSync(trace, 'utf8').trim().split('\n')) {
              const event = JSON.parse(line);
              if (event.event === 'start') {
                const phase = timings.find(item => Date.parse(event.time) >= item.startedAt && Date.parse(event.time) <= item.endedAt)?.phase || 'outside-command';
                const verb = ['fetch', 'reset', 'clean', 'log', 'diff', 'show', 'describe', 'rev-list', 'rev-parse'].find(value => event.argv?.includes(value)) || 'other';
                const promisorLazy = verb === 'fetch' && event.argv.includes('--no-write-fetch-head') && event.argv.includes('--stdin');
                processes.set(event.sid, {phase, verb, promisorLazy});
              } else if (event.event === 'exit' && processes.has(event.sid)) {
                Object.assign(processes.get(event.sid), {seconds: event.t_abs, code: event.code});
              }
            }
            const safeProcesses = [...processes.values()];
            const fetches = safeProcesses.filter(item => item.verb === 'fetch');
            if (!fetches.some(item => item.phase === 'base-fetch')) throw new Error('Missing explicit fetch trace');
            const basePhases = ['base-fetch', 'base-clean', 'base-checkout', 'base-install', 'base-build'];
            const summary = {
              filtered: blobless, fetches, processes: safeProcesses,
              lazyFetches: fetches.filter(item => item.promisorLazy),
              otherFetches: fetches.filter(item => !item.promisorLazy && item.phase !== 'base-fetch'),
              baseCommandSeconds: timings.filter(item => basePhases.includes(item.phase)).reduce((sum, item) => sum + item.seconds, 0),
              observationAndConfigSeconds: timings.reduce((sum, item) => sum + item.observationAndConfigSeconds, 0) + (performance.now() - finishStarted) / 1000,
              basePackGrowthBytes: samples.at(-1).packBytes - samples[0].packBytes,
            };
            fs.writeFileSync(path.join(trial, 'results/git-costs.json'), JSON.stringify(summary, null, 2));
          }
          NODE
          node --check "$TRIAL/action/git-observe.mjs"

      - name: 'Install initial dependencies in both arms'
        shell: bash
        run: |
          date +%s > "$TRIAL/results/trial-started.txt"
          started=$SECONDS
          pnpm install --filter='@woocommerce/plugin-woocommerce...' --frozen-lockfile
          echo "$((SECONDS - started))" > "$TRIAL/results/setup-install-seconds.txt"

      - name: 'Keep the genuine redundant setup build in the control'
        if: ${{ matrix.arm == 'baseline' }}
        shell: bash
        run: |
          started=$SECONDS
          pnpm --filter='@woocommerce/plugin-woocommerce' build
          echo "$((SECONDS - started))" > "$TRIAL/results/setup-build-seconds.txt"

      - name: 'Snapshot the control initial build outside its timer'
        if: ${{ matrix.arm == 'baseline' }}
        run: |
          started=$SECONDS
          node "$TRIAL/action/initial.mjs"
          echo "$((SECONDS - started))" > "$TRIAL/results/setup-snapshot-seconds.txt"

      - name: 'Enable Corepack as in Compressed Size'
        run: npm install -g corepack@latest && corepack enable pnpm

      - name: 'Run pinned current/base builds and measurement without reporting'
        id: measurement
        run: node "$TRIAL/action/measure.mjs"

      - name: 'Record local outcome and cache/tool identities'
        if: ${{ always() }}
        env:
          RESULT: ${{ job.status }}
          PNPM_HIT: ${{ steps.pnpm-cache.outputs.cache-hit }}
          NODE_HIT: ${{ steps.node-cache.outputs.cache-hit }}
          COMPOSER_HIT: ${{ steps.composer-cache.outputs.cache-hit }}
          PNPM_MATCH: ${{ steps.pnpm-cache.outputs.cache-matched-key }}
          NODE_MATCH: ${{ steps.node-cache.outputs.cache-matched-key }}
          COMPOSER_MATCH: ${{ steps.composer-cache.outputs.cache-matched-key }}
        shell: bash
        run: |
          TRIAL="$RUNNER_TEMP/size-build-experiment"
          mkdir -p "$TRIAL/results"
          if [[ -f "$TRIAL/results/trial-started.txt" ]]; then
            elapsed=$(( $(date +%s) - $(cat "$TRIAL/results/trial-started.txt") ))
            snapshot=0
            if [[ -f "$TRIAL/results/setup-snapshot-seconds.txt" ]]; then snapshot=$(cat "$TRIAL/results/setup-snapshot-seconds.txt"); fi
            echo "$elapsed" > "$TRIAL/results/trial-wall-seconds.txt"
            echo "$((elapsed - snapshot))" > "$TRIAL/results/trial-seconds.txt"
          fi
          {
            echo "Arm=$ARM result=$RESULT head=$HEAD_SHA base=$BASE_SHA action=$ACTION_SHA"
            echo "Exact cache hits: pnpm=$PNPM_HIT node=$NODE_HIT composer=$COMPOSER_HIT"
            echo "Matched keys: pnpm=$PNPM_MATCH node=$NODE_MATCH composer=$COMPOSER_MATCH"
            node --version
            pnpm --version
            php --version | head -1
            echo 'PHP setup skipped, matching Compressed Size. No cache writes or external reporting.'
          } | tee "$TRIAL/results/metadata.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: 'Upload small results within this run'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-build-${{ matrix.arm }}-${{ github.run_id }}
          path: ${{ runner.temp }}/size-build-experiment/results/
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  compare:
    name: 'Require equivalent head and base measurements'
    needs: measure
    if: ${{ !cancelled() && github.repository == 'woocommerce/woocommerce' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/pr-ci-speedups' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 'Download measurements from this run'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: size-build-*-${{ github.run_id }}
          path: ${{ runner.temp }}/size-build-results

      - name: 'Compare exact assets, sizes and local report'
        env:
          RESULTS: ${{ runner.temp }}/size-build-results
        shell: bash
        run: |
          python3 <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RESULTS'])
          baseline = root / ('size-build-baseline-' + os.environ['GITHUB_RUN_ID'])
          arms = ['baseline', 'skip-setup-build', 'skip-setup-build-blobless']
          folders = {arm: root / ('size-build-' + arm + '-' + os.environ['GITHUB_RUN_ID']) for arm in arms}
          failures = []
          lines = []
          def compare(left, right, name):
              if not left.is_file() or not right.is_file():
                  failures.append(name + ': missing result')
                  return
              a, b = json.loads(left.read_text()), json.loads(right.read_text())
              if a != b:
                  failures.append(name + ': output mismatch; equivalence is unproven (possible nondeterminism)')
                  if isinstance(a, list) and a and 'file' in a[0]:
                      aa, bb = {x['file']: x for x in a}, {x['file']: x for x in b}
                      differences = [key for key in sorted(aa.keys() | bb.keys()) if aa.get(key) != bb.get(key)]
                      lines.append(name + ': differing files=' + str(len(differences)) + '; first 25=' + repr(differences[:25]))
              else:
                  lines.append(name + ': exact equality')
          for arm in arms[1:]:
              for name in ['head', 'base', 'diff', 'base-history']:
                  compare(baseline / (name + '.json'), folders[arm] / (name + '.json'), arm + ' ' + name)
          compare(baseline / 'setup-head.json', baseline / 'head.json', 'Control first versus repeated head build')
          for arm, folder in folders.items():
              for name in ['size-report.md', 'action-source-sha256.txt']:
                  a, b = baseline / name, folder / name
                  if not a.is_file() or not b.is_file() or a.read_bytes() != b.read_bytes():
                      failures.append(arm + ' ' + name + ': missing or different')
              for name in ['head', 'base']:
                  target = folder / (name + '.json')
                  if not target.is_file() or not json.loads(target.read_text()):
                      failures.append(arm + ' ' + name + ': missing or empty assets')
              history_path, costs_path, observations_path = [folder / name for name in ['base-history.json', 'git-costs.json', 'git-observations.json']]
              if not all(target.is_file() for target in [history_path, costs_path, observations_path]):
                  failures.append(arm + ': missing Git evidence')
              else:
                  history, costs, observations = [json.loads(target.read_text()) for target in [history_path, costs_path, observations_path]]
                  if history.get('base') != os.environ['BASE_SHA'] or not history.get('tree') or history.get('commits', 0) < 2 or len(history.get('parentsSha256', '')) != 64:
                      failures.append(arm + ': invalid base commit-parent manifest')
                  if history.get('shallowBefore') != history.get('shallowAfter') or history.get('shallowBefore', '').strip() != os.environ['HEAD_SHA']:
                      failures.append(arm + ': changed or unexpected shallow boundary')
                  if not any(item.get('phase') == 'base-fetch' for item in costs.get('fetches', [])):
                      failures.append(arm + ': missing explicit-fetch trace')
                  if costs.get('filtered') != (arm == 'skip-setup-build-blobless'):
                      failures.append(arm + ': incorrect filtering policy')
                  expected_labels = ['before-fetch', 'after-fetch', 'after-base-checkout', 'after-base-build', 'after-measurement']
                  if [item.get('label') for item in observations] != expected_labels:
                      failures.append(arm + ': missing Git phase samples')
                  elif any(item.get('shallow') != history['shallowBefore'] for item in observations):
                      failures.append(arm + ': shallow boundary changed during measurement')
                  elif arm == 'skip-setup-build-blobless' and (observations[1].get('promisor') != 'true' or observations[1].get('filter') != 'blob:none'):
                      failures.append(arm + ': missing persistent promisor configuration')
                  lines.append(arm + ' Git costs: ' + json.dumps(costs, sort_keys=True))
              for name in ['setup-install-seconds.txt', 'setup-build-seconds.txt', 'setup-snapshot-seconds.txt', 'trial-wall-seconds.txt', 'trial-seconds.txt', 'action-total.json']:
                  target = folder / name
                  if target.exists():
                      lines.append(arm + ' ' + name + ': ' + target.read_text().strip())
          lines += failures
          report = '\n'.join(lines) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(report)
          if failures:
              raise SystemExit(1)
          PY
