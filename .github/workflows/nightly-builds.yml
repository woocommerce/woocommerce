name: 'Nightly builds'

on:
  schedule:
    - cron: '0 0 * * 1'  # Run every Monday at 00:00 UTC
  workflow_dispatch:

env:
  SOURCE_REF: trunk

permissions: {}

jobs:
  build:
    if: github.repository_owner == 'woocommerce'
    name: 'Nightly builds'

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 'Checkout trunk'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 0

      - name: 'Set current date'
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: 'Find last nightly tag'
        id: last_tag
        run: |
          last_tag=$(git tag --list "nightly-*" --sort=-creatordate | tail -n 1)
          echo "last_tag=$last_tag" >> $GITHUB_OUTPUT

      - name: 'Generate changelog'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          LAST_TAG="${{ steps.last_tag.outputs.last_tag }}"
          echo "## Nightly build for $DATE" > changelog.md

          if [ -z "$LAST_TAG" ]; then
            echo "No previous nightly found. Showing last 20 commits." >> changelog.md
            git log --pretty=format:'- %s (%h)' -n 20 >> changelog.md
          else
            git log "$LAST_TAG"..HEAD --pretty=format:'- %s (%h)' >> changelog.md
          fi

      - name: 'Setup WooCommerce Monorepo'
        uses: './.github/actions/setup-woocommerce-monorepo'
        with:
          pull-package-deps: '@woocommerce/plugin-woocommerce'

      - name: 'Build zip'
        working-directory: plugins/woocommerce
        run: bash bin/build-zip.sh

      - name: 'Create new nightly tag'
        run: |
          DATE="${{ steps.date.outputs.date }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag nightly-$DATE
          git push origin nightly-$DATE

      - name: 'Create GitHub Release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly-${{ steps.date.outputs.date }}
          name: Nightly – ${{ steps.date.outputs.date }}
          body_path: changelog.md
          files: plugins/woocommerce/woocommerce.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
