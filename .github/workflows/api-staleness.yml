name: 'GraphQL API Staleness Check'

on:
    pull_request:
        paths:
            - 'plugins/woocommerce/src/Api/**'
            - 'plugins/woocommerce/src/Internal/Api/Autogenerated/**'
            - 'plugins/woocommerce/src/Internal/Api/DesignTime/**'
            - '.github/workflows/api-staleness.yml'
    push:
        paths:
            - 'plugins/woocommerce/src/Api/**'
            - 'plugins/woocommerce/src/Internal/Api/Autogenerated/**'
            - 'plugins/woocommerce/src/Internal/Api/DesignTime/**'
            - '.github/workflows/api-staleness.yml'
        branches:
            - 'trunk'
            - 'release/*'

concurrency:
    group: api-staleness-${{ github.event_name == 'push' && github.run_id || github.event_name }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    api-staleness:
        name: 'GraphQL API Staleness Check'
        runs-on: ubuntu-latest
        steps:
            - uses: 'actions/checkout@v4'
              name: 'Checkout'

            - uses: './.github/actions/setup-woocommerce-monorepo'
              id: 'setup-monorepo'
              with:
                  install: '@woocommerce/plugin-woocommerce...'
                  pull-package-deps: '@woocommerce/plugin-woocommerce'
                  php-version: '8.4'

            - name: 'Regenerate GraphQL API'
              run: pnpm --filter='@woocommerce/plugin-woocommerce' build:api

            - name: 'Check for stale generated code'
              run: |
                  AUTOGEN_DIR="plugins/woocommerce/src/Internal/Api/Autogenerated"
                  if ! git diff --exit-code -- "$AUTOGEN_DIR" ":(exclude)$AUTOGEN_DIR/api_generation_date.txt"; then
                      echo ""
                      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                      echo "::error::Generated GraphQL API code is out of date."
                      echo ""
                      echo "The autogenerated files under $AUTOGEN_DIR no longer match"
                      echo "what 'pnpm run build:api' produces from the current code-API sources."
                      echo ""
                      echo "To fix this:"
                      echo "  1. Run 'pnpm --filter=@woocommerce/plugin-woocommerce build:api' locally"
                      echo "  2. Commit the regenerated files"
                      echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
                      exit 1
                  fi
