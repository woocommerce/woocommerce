name: 'CI / Legacy Minicart e2e tests'

on:
    workflow_dispatch:
    pull_request:
    push:
        paths-ignore:
            - 'docs/**'
            - '**/changelog/**'
            - '.cursor/**'
            - '**/*.md'
            - '**/changelog.txt'
            - '.gitignore'
            - '.coderabbit.yml'
            - 'CODEOWNERS'
            - '.github/**'
            - '!.github/workflows/ci.yml'
        branches:
            - 'trunk'
            - 'release/*'

jobs:
    test-minicart:
        name: 'CI / Legacy Minicart e2e tests'
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false

        steps:
            - uses: 'actions/checkout@v4'
              name: 'Checkout'

            - name: 'Set experimental-iapi-mini-cart feature flag to false'
              run: |
                  sudo apt-get update && sudo apt-get install -y jq
                  jq '.features."experimental-iapi-mini-cart" = false' plugins/woocommerce/client/admin/config/core.json > tmp.json && mv tmp.json plugins/woocommerce/client/admin/config/core.json
                  echo "Set experimental-iapi-mini-cart to false in core.json:"
                  cat plugins/woocommerce/client/admin/config/core.json | grep experimental-iapi-mini-cart

            - name: 'Verify experimental-iapi-mini-cart feature flag'
              run: |
                  echo "Expected value for experimental-iapi-mini-cart: false"
                  echo "Current value in core.json:"
                  cat plugins/woocommerce/client/admin/config/core.json | grep experimental-iapi-mini-cart

            - name: Setup - pnpm
              uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

            - uses: './.github/actions/setup-woocommerce-monorepo'
              name: 'Install Monorepo'
              id: 'install-monorepo'
              with:
                  install: '@woocommerce/block-library...'
                  build: '@woocommerce/block-library'
                  build-type: 'full'
                  pull-playwright-cache: true
                  pull-package-deps: '@woocommerce/block-library'

            - name: 'Update wp-env config'
              run: |
                  # band-aid to get the path to wp-env.json for blocks e2e tests
                  WP_ENV_CONFIG_PATH="${{ github.workspace }}/plugins/woocommerce/client/blocks"
                  echo "WP_ENV_CONFIG_PATH=$WP_ENV_CONFIG_PATH" >> "$GITHUB_ENV"

            - name: 'Start Test Environment'
              id: 'prepare-test-environment'
              run: |
                  min=10
                  max=99
                  randomized=$(( ($RANDOM % ($max - $min + 1)) + $min ))
                  httpport="${randomized}80"
                  mysqlport="${randomized}36"
                  echo "WP_ENV_TESTS_PORT=$httpport" >> "$GITHUB_ENV"
                  echo "WP_ENV_TESTS_MYSQL_PORT=$mysqlport" >> "$GITHUB_ENV"
                  echo "WP_BASE_URL=http://localhost:$httpport" >> "$GITHUB_ENV"
                  WP_ENV_TESTS_PORT=$httpport WP_ENV_TESTS_MYSQL_PORT=$mysqlport pnpm --filter="@woocommerce/block-library" env:start

            - name: 'Resolve artifacts path'
              run: |
                  # Create artifacts directory
                  mkdir -p plugins/woocommerce/client/blocks/tests/e2e/test-results
                  echo "ARTIFACTS_PATH=plugins/woocommerce/client/blocks/tests/e2e/test-results" >> $GITHUB_ENV

            - name: 'Run all e2e tests (with feature flag disabled)'
              env:
                  BUILDKITE_ANALYTICS_TOKEN: ${{ secrets.BUILDKITE_CORE_E2E_TOKEN }}
                  E2E_ENV_KEY: ${{ secrets.E2E_ENV_KEY }}
              run: |
                  pnpm --filter="@woocommerce/block-library" test:e2e

            - name: 'Determine BuildKite Analytics Message'
              env:
                  HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
                  PR_TITLE: ${{ github.event.pull_request.title }}
              run: |
                  if [[ "${{ github.event_name }}" == "push" ]]; then
                      MESSAGE=`echo "$HEAD_COMMIT_MESSAGE" | head -1`
                  elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
                      MESSAGE="$PR_TITLE"
                  else
                      MESSAGE="${{ github.event_name }}"
                  fi
                  echo "BUILDKITE_ANALYTICS_MESSAGE=$MESSAGE" >> $GITHUB_ENV

            - name: 'Upload artifacts'
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: 'minicart-e2e-test-results'
                  path: ${{ env.ARTIFACTS_PATH }}
                  if-no-files-found: ignore
