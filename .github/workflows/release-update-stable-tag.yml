name: 'Release: Update stable tag'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (in X.Y.Z or X.Y format)'
        required: true
        default: ''
      dry-run:
        description: 'Do a dry-run of the stable tag update (if UNCHECKED, it will commit the change!)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
      branch: ${{ steps.extract-version.outputs.branch }}
    steps:
      - name: Validate release version
        id: extract-version
        uses: actions/github-script@v7
        with:
          script: |
            const versionInput = '${{ github.event.inputs.version }}';

            // Match X.Y.Z or X.Y formats
            const versionMatch = versionInput.match(/^(\d+\.\d+)(?:\.(\d+))?$/);

            if (versionMatch) {
              const major = versionMatch[1]; // X.Y
              const patch = versionMatch[2] || '0'; // Z (default to 0 if not provided)

              const version = `${major}.${patch}`;
              const branch = `release/${major}`;

              console.log(`Input version: ${versionInput}`);
              console.log(`Normalized version: ${version}`);
              console.log(`Release branch: ${branch}`);
              core.setOutput('version', version);
              core.setOutput('branch', branch);
            } else {
              core.setFailed(`Version ${versionInput} does not match the expected format (X.Y.Z or X.Y)`);
              process.exit(1);
            }

  verify-release-branch:
    runs-on: ubuntu-latest
    needs: validate-release-version
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release branch exists
        run: |
          RELEASE_BRANCH="${{ needs.validate-release-version.outputs.branch }}"
          if ! git ls-remote --heads origin "$RELEASE_BRANCH" | grep -q "refs/heads/$RELEASE_BRANCH"; then
            echo "❌ ERROR: Release branch '$RELEASE_BRANCH' does not exist"
            exit 1
          else
            echo "✅ Release branch '$RELEASE_BRANCH' exists"
          fi

  update-wporg-stable-tag:
    runs-on: ubuntu-latest
    needs: [validate-release-version, verify-release-branch]
    steps:
      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Update SVN stable tag
        env:
          TARGET_VERSION: ${{ needs.validate-release-version.outputs.version }}
        run: |
          echo "🔄 Checking out SVN repository..."
          svn checkout "${{ secrets.WPORG_SVN_URL }}" ./svn-woocommerce-repo --username "${{ secrets.WPORG_SVN_USERNAME }}" --password "${{ secrets.WPORG_SVN_PASSWORD }}" --non-interactive
          cd ./svn-woocommerce-repo

          README_PATH="./trunk/readme.txt"

          if [ ! -f "$README_PATH" ]; then
            echo "❌ ERROR: readme.txt not found at $README_PATH"
            exit 1
          fi

          echo "📋 Current stable tag line:"
          grep "^Stable tag:" "$README_PATH" || echo "Stable tag line not found"
          echo "=========================="

          if sed -i "s/^Stable tag: .*/Stable tag: $TARGET_VERSION/" "$README_PATH"; then
            echo "📝 Updated stable tag line:"
            grep "^Stable tag:" "$README_PATH" || echo "Stable tag line not found"
            echo "=========================="

            if [ "${{ github.event.inputs.dry-run }}" == "true" ]; then
              echo "🔍 DRY-RUN MODE: No SVN commit made."
              echo "📝 Check the updated readme above."
              echo "✅ To actually update, uncheck 'Do a dry-run' option"
            else
              echo "📤 Committing changes to SVN..."
              svn commit -m "Setting stable tag to $TARGET_VERSION" --username "${{ secrets.WPORG_SVN_USERNAME }}" --password "${{ secrets.WPORG_SVN_PASSWORD }}" --non-interactive
              echo "✅ Successfully committed stable tag update to $TARGET_VERSION"
            fi
          else
            echo "❌ ERROR: Unable to update stable tag in SVN"
            exit 1
          fi

  update-gh-stable-tag:
    runs-on: ubuntu-latest
    needs: [validate-release-version, verify-release-branch, update-wporg-stable-tag]
    strategy:
      matrix:
        branch:
          - trunk
          - ${{ needs.validate-release-version.outputs.branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            plugins/woocommerce/readme.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Update stable tag on ${{ matrix.branch }}
        env:
          TARGET_VERSION: ${{ needs.validate-release-version.outputs.version }}
          BRANCH_NAME: ${{ matrix.branch }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Processing branch: $BRANCH_NAME..."

          git checkout "$BRANCH_NAME"

          README_PATH="plugins/woocommerce/readme.txt"

          if [ ! -f "$README_PATH" ]; then
            echo "❌ ERROR: readme.txt not found at $README_PATH"
            exit 1
          fi

          echo "📋 Current stable tag line on $BRANCH_NAME:"
          grep "^Stable tag:" "$README_PATH" || echo "Stable tag line not found"
          echo "=========================="

          if sed -i "s/^Stable tag: .*/Stable tag: $TARGET_VERSION/" "$README_PATH"; then
            echo "📝 Updated stable tag line on $BRANCH_NAME:"
            grep "^Stable tag:" "$README_PATH" || echo "Stable tag line not found"
            echo "=========================="

            # Check if file was actually modified
            if git diff --quiet "$README_PATH"; then
              echo "ℹ️ No changes needed on $BRANCH_NAME - stable tag is already $TARGET_VERSION"
            elif [ "${{ github.event.inputs.dry-run }}" == "true" ]; then
              echo "🔍 DRY-RUN MODE: No GitHub PR created for $BRANCH_NAME."
              echo "📝 Check the updated readme above."
              echo "✅ To actually create the PR, uncheck 'Do a dry-run' option"
            else
              echo "📤 Creating PR for $BRANCH_NAME..."

              UPDATE_BRANCH="update/stable-tag-$TARGET_VERSION-$BRANCH_NAME"
              git checkout -b "$UPDATE_BRANCH"
              git add "$README_PATH"
              git commit -m "Update stable tag to $TARGET_VERSION on $BRANCH_NAME"
              git push origin "$UPDATE_BRANCH"

              gh pr create \
                --title "Update stable tag to $TARGET_VERSION ($BRANCH_NAME)" \
                --body "This PR updates the stable tag to $TARGET_VERSION." \
                --base "$BRANCH_NAME" \
                --head "$UPDATE_BRANCH"

              echo "✅ Successfully created PR to update stable tag to $TARGET_VERSION on $BRANCH_NAME"
            fi
          else
            echo "❌ ERROR: Unable to update stable tag on $BRANCH_NAME"
            exit 1
          fi
