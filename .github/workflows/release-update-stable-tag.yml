name: 'Release: Update stable tag'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (in X.Y.Z format)'
        required: true
        default: ''
      dry-run:
        description: 'Do a dry-run of the stable tag update (if UNCHECKED, it will commit the change!)'
        type: boolean
        required: false
        default: true

jobs:
  update-wporg-stable-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release version
        id: extract-version
        uses: actions/github-script@v7
        with:
          script: |
            const versionInput = '${{ github.event.inputs.version }}';
            const versionMatch = versionInput.match(/^(\d+\.\d+\.\d+(?:-[a-z]+)?)$/);
            if (versionMatch) {
              const version = versionMatch[1];
              console.log(`Extracted version: ${version}`);
              core.setOutput('version', version);
            } else {
              core.setFailed(`Version ${versionInput} does not match the expected format (X.Y.Z or X.Y.Z-tag)`);
              process.exit(1);
            }

      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Update SVN stable tag
        env:
          TARGET_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "Checking out repository..."
          svn checkout "${{ secrets.SVN_REPO_URL }}" ./svn-woocommerce-repo --username "${{ secrets.SVN_USERNAME }}" --password "${{ secrets.SVN_PASSWORD }}" --non-interactive
          cd ./svn-woocommerce-repo

          README_PATH="./trunk/readme.txt"

          if [ ! -f "$README_PATH" ]; then
            echo "ERROR: readme.txt not found at $README_PATH"
            exit 1
          fi

          echo "Current readme.txt content:"
          cat "$README_PATH"
          echo "=========================="

          # Update stable tag in readme.txt
          if sed -i "s/Stable tag: .*/Stable tag: $TARGET_VERSION/" "$README_PATH"; then
            echo "Updated stable tag to $TARGET_VERSION"

            echo "Updated readme.txt content:"
            cat "$README_PATH"
            echo "=========================="

            if [ "${{ github.event.inputs.dry-run }}" == "true" ]; then
              echo "🔍 DRY-RUN MODE: No commit made."
              echo "📝 Check the updated readme above."
              echo "✅ To actually update, uncheck 'Do a dry-run' option"
            else
              echo "📤 Committing changes..."
              svn commit -m "Setting stable tag to $TARGET_VERSION" --username "${{ secrets.SVN_USERNAME }}" --password "${{ secrets.SVN_PASSWORD }}" --non-interactive
              echo "✅ Successfully committed stable tag update to $TARGET_VERSION"
            fi
          else
            echo "❌ ERROR: Unable to update stable tag"
            exit 1
          fi