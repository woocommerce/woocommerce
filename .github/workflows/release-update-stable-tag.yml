name: 'Release: Update stable tag'
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (in X.Y.Z format)'
        required: true
        default: ''
      dry-run:
        description: 'Do a dry-run of the stable tag update (if UNCHECKED, it will commit the change!)'
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-release-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract-version.outputs.version }}
    steps:
      - name: Validate release version
        id: extract-version
        uses: actions/github-script@v7
        with:
          script: |
            const versionInput = '${{ github.event.inputs.version }}';
            const versionMatch = versionInput.match(/^(\d+\.\d+\.\d+(?:-[a-z]+)?)$/);
            if (versionMatch) {
              const version = versionMatch[1];
              console.log(`Extracted version: ${version}`);
              core.setOutput('version', version);
            } else {
              core.setFailed(`Version ${versionInput} does not match the expected format (X.Y.Z or X.Y.Z-tag)`);
              process.exit(1);
            }

  update-wporg-stable-tag:
    runs-on: ubuntu-latest
    needs: validate-release-version
    steps:
      - name: Install SVN
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Update SVN stable tag
        env:
          TARGET_VERSION: ${{ github.event.inputs.version }}
        run: |
          echo "Checking out repository..."
          svn checkout "${{ secrets.SVN_REPO_URL }}" ./svn-woocommerce-repo --username "${{ secrets.SVN_USERNAME }}" --password "${{ secrets.SVN_PASSWORD }}" --non-interactive
          cd ./svn-woocommerce-repo

          README_PATH="./trunk/readme.txt"

          if [ ! -f "$README_PATH" ]; then
            echo "ERROR: readme.txt not found at $README_PATH"
            exit 1
          fi

          echo "Current readme.txt content:"
          cat "$README_PATH"
          echo "=========================="

          if sed -i "s/Stable tag: .*/Stable tag: $TARGET_VERSION/" "$README_PATH"; then
            echo "Updated stable tag to $TARGET_VERSION"

            echo "Updated readme.txt content:"
            cat "$README_PATH"
            echo "=========================="

            if [ "${{ github.event.inputs.dry-run }}" == "true" ]; then
              echo "🔍 DRY-RUN MODE: No commit made."
              echo "📝 Check the updated readme above."
              echo "✅ To actually update, uncheck 'Do a dry-run' option"
            else
              echo "📤 Committing changes..."
              svn commit -m "Setting stable tag to $TARGET_VERSION" --username "${{ secrets.SVN_USERNAME }}" --password "${{ secrets.SVN_PASSWORD }}" --non-interactive
              echo "✅ Successfully committed stable tag update to $TARGET_VERSION"
            fi
          else
            echo "❌ ERROR: Unable to update stable tag"
            exit 1
          fi

  update-gh-stable-tag:
    runs-on: ubuntu-latest
    needs: [validate-release-version, update-wporg-stable-tag]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: trunk
          sparse-checkout: |
            plugins/woocommerce/readme.txt
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub stable tag
        env:
          TARGET_VERSION: ${{ needs.validate-release-version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          README_PATH="plugins/woocommerce/readme.txt"

          if [ ! -f "$README_PATH" ]; then
            echo "ERROR: readme.txt not found at $README_PATH"
            exit 1
          fi

          echo "Current stable tag line:"
          grep "Stable tag:" "$README_PATH" || echo "Stable tag line not found"
          echo "=========================="

          if sed -i "s/^Stable tag: .*/Stable tag: $TARGET_VERSION/" "$README_PATH"; then
            echo "Updated stable tag to $TARGET_VERSION"

            echo "Updated stable tag line:"
            grep "Stable tag:" "$README_PATH" || echo "Stable tag line not found"
            echo "=========================="

            # Check if file was actually modified
            if git diff --quiet "$README_PATH"; then
              echo "ℹ️ No changes needed - stable tag is already $TARGET_VERSION"
            elif [ "${{ github.event.inputs.dry-run }}" == "true" ]; then
              echo "🔍 DRY-RUN MODE: No GitHub PR created."
              echo "📝 Check the updated readme above."
              echo "✅ To actually create the PR, uncheck 'Do a dry-run' option"
            else
              echo "📤 Creating PR..."

              # Configure git
              git config user.name github-actions
              git config user.email github-actions@github.com

              # Create branch, commit, and push
              update_branch="update/stable-tag-$TARGET_VERSION"
              git checkout -b "$update_branch"
              git add "$README_PATH"
              git commit -m "Update stable tag to $TARGET_VERSION"
              git push origin "$update_branch"

              # Create PR using GitHub CLI
              gh pr create \
                --title "Update stable tag to $TARGET_VERSION" \
                --body "This PR updates the stable tag to $TARGET_VERSION." \
                --base trunk \
                --head "$update_branch"

              echo "✅ Successfully created PR to update stable tag to $TARGET_VERSION"
            fi
          else
            echo "❌ ERROR: Unable to update stable tag"
            exit 1
          fi