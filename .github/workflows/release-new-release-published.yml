name: 'Release: Post-release published flows'
on:
  workflow_call:
    inputs:
      release_tag_name:
        description: 'The release tag name'
        required: true
        type: string

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:
  # Jobs to run after a pre-release is published (triggered by the "prereleased" GH event).
  generate-release-commits-and-contributors:
    name: 'Call release commits and contributors workflow'
    if: ${{ ( github.event.action == 'prereleased' || ( github.event.action == 'published' && github.event.release.prerelease ) ) &&  contains( inputs.release_tag_name, '-beta' ) }}
    uses: woocommerce/woocommerce/.github/workflows/release-commits-and-contributors.yml@trunk
    with:
      version: ${{ inputs.release_tag_name }}
    secrets: inherit

  # Jobs to run after a final release is published (triggered by the "published" GH event).
  notify-release-published:
    name: 'Notify in Slack when a new (pre)release is published'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.action == 'published' && ! ( contains( inputs.release_tag_name, '-dev' ) || contains( inputs.release_tag_name, '-rc' ) ) }}
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: trunk
          sparse-checkout: |
            /plugins/woocommerce/woocommerce.php
          sparse-checkout-cone-mode: false

      - name: 'Get release branch from tag'
        id: get-branch
        env:
          RELEASE_TAG: ${{ inputs.release_tag_name }}
        run: |
          # Extract major.minor from version (e.g., 10.3.5 -> 10.3)
          if [[ "$RELEASE_TAG" =~ ^([0-9]+\.[0-9]+) ]]; then
            major_minor="${BASH_REMATCH[1]}"
            branch_name="release/${major_minor}"
            echo "Release branch: $branch_name"
            echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          else
            echo "::error::Could not extract version from tag: $RELEASE_TAG"
            exit 1
          fi

      - name: 'Validate release tag version matches the release branch version'
        id: validate-version
        env:
          RELEASE_TAG: ${{ inputs.release_tag_name }}
          BRANCH_NAME: ${{ steps.get-branch.outputs.branch_name }}
        run: |
          git fetch origin ${BRANCH_NAME}
          git checkout ${BRANCH_NAME}
          current_version=$( cat plugins/woocommerce/woocommerce.php | grep -oP '(?<=Version: )(.+)' | head -n1 )

          echo "Current version from woocommerce.php: '$current_version'"
          echo "Release tag version: '$RELEASE_TAG'"

          if [[ "$current_version" != "$RELEASE_TAG" ]]; then
            echo "::warning::The version in woocommerce.php ($current_version) does not match the release tag version ($RELEASE_TAG). Skipping notification."
            echo "versions_match=false" >> $GITHUB_OUTPUT
          else
            echo "versions_match=true" >> $GITHUB_OUTPUT
          fi

      - name: 'Notify to release channel'
        if: steps.validate-version.outputs.versions_match == 'true'
        uses: archive/github-actions-slack@a62d71a4ea93e68cbdc37581166b0298bea512e9 # v 2.10.0
        with:
          slack-bot-user-oauth-access-token: ${{ secrets.CODE_FREEZE_BOT_TOKEN }}
          slack-channel: ${{ secrets.WOO_RELEASE_SLACK_CHANNEL }}
          slack-optional-unfurl_links: false
          slack-text: |
            :woo-bounce: *<https://github.com/woocommerce/woocommerce/releases/tag/${{ inputs.release_tag_name }}|WooCommerce ${{ inputs.release_tag_name }}>* has been released! :rocket:
            (<!subteam^S086N376UTS> could you publish the release post? :ty2:)

  update-global-changelog:
    name: 'Update changelog.txt after any stable release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ github.event.action == 'published' && ! ( contains( inputs.release_tag_name, '-dev' ) || contains( inputs.release_tag_name, '-beta' ) || contains( inputs.release_tag_name, '-rc' ) ) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: 'Fetch release readme.txt'
        env:
          RELEASE_TAG: ${{ inputs.release_tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$RELEASE_TAG" --pattern 'woocommerce.zip'
          unzip -qq woocommerce.zip

          if [[ ! -e woocommerce/readme.txt ]]; then
            echo "::error::Could not find readme.txt in asset for release '$RELEASE_TAG'."
            exit 1
          fi
      - name: 'Fetch latest changelog.txt and changelog script'
        uses: 'actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0' # v7.0.0
        with:
          ref: trunk
          sparse-checkout: |
            /changelog.txt
            /.github/workflows/scripts/release-readme-to-changelog.php
          sparse-checkout-cone-mode: false
          path: trunk
      - name: 'Update changelog.txt'
        run: |
          php ./trunk/.github/workflows/scripts/release-readme-to-changelog.php ./woocommerce/readme.txt ./trunk/changelog.txt
      - name: 'Push changes and open PR'
        env:
          GH_TOKEN: ${{ secrets.WC_BOT_PR_CREATE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Determine milestone from release version.
          milestone=$( cat ./woocommerce/woocommerce.php | grep -oP '(?<=Version: )(.+)' | head -n1 | sed 's/\.[0-9]\+$/.0/' )

          # Configure Git.
          git config --global user.name "woocommercebot"
          git config --global user.email "woocommercebot@users.noreply.github.com"

          # Push new changelog.txt.
          branch_name="update-changelog-${{ inputs.release_tag_name }}-$(date +%s)"
          cd trunk
          git checkout -b "$branch_name"
          git commit \
            --all \
            --message 'Update changelog.txt after release ${{ inputs.release_tag_name }}'
          git push origin "$branch_name"

          # Open a PR.
          gh pr create \
            --title 'Update changelog.txt after ${{ inputs.release_tag_name }}' \
            --body 'This PR updates the global changelog.txt file following the release of version ${{ inputs.release_tag_name }}.' \
            --base trunk \
            --head "$branch_name" \
            --reviewer "${{ github.actor }}" \
            --label "Release" \
            --milestone "$milestone"

  bump-min-security-support-version:
    name: 'Bump the minimum security-support version after a new major release'
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'published' && endsWith(inputs.release_tag_name, '.0') }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: 'Checkout trunk'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: trunk
          sparse-checkout: |
            /docs/contribution/releases/security-support.md
          sparse-checkout-cone-mode: false

      - name: 'Bump the minimum security-support version and open a PR'
        env:
          RELEASE_TAG: ${{ inputs.release_tag_name }}
          GH_TOKEN: ${{ secrets.WC_BOT_PR_CREATE_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # This job only runs for tag X.Y.0 (see the job-level `if`). The minimum
          # supported version always sits 2.0 behind it (e.g. 11.0 -> 9.0).
          main_version="${RELEASE_TAG%.0}"
          min_version=$(echo "$main_version - 2.0" | bc)

          file="docs/contribution/releases/security-support.md"
          current_version=$(grep -oP '(?<=current stable WooCommerce version is )[0-9]+\.[0-9]+' "$file")

          if [[ -z "$current_version" ]]; then
            echo "::error::Could not find the currently documented version in $file. The sentence this automation matches on may have changed - update this workflow."
            exit 1
          fi

          # Guard against a delayed or replayed release event moving the version backwards.
          if [[ "$main_version" == "$current_version" ]] || ! printf '%s\n%s\n' "$current_version" "$main_version" | sort -C -V; then
            echo "$file already reflects $current_version, which is not older than $main_version. Nothing to do."
            exit 0
          fi

          sed -i -E "s/(current stable WooCommerce version is )[0-9]+\.[0-9]+(, that means version \*\*)[0-9]+\.[0-9]+( and newer\*\*)/\1$main_version\2$min_version\3/" "$file"

          if ! grep -q "current stable WooCommerce version is $main_version, that means version \*\*$min_version and newer\*\*" "$file"; then
            echo "::error::Could not update the minimum supported version in $file. The sentence this automation matches on may have changed - update the sed pattern in this workflow."
            exit 1
          fi

          git config --global user.name "woocommercebot"
          git config --global user.email "woocommercebot@users.noreply.github.com"

          # Branch name hardcoded (per release) to avoid duplicate PRs on reruns.
          branch_name="bump-min-security-support-version-$RELEASE_TAG"
          git checkout -b "$branch_name"
          git commit --all --message "Bump the minimum security-support version to $min_version"
          git push --force origin "$branch_name"

          pr_title="Bump the minimum security-support version to $min_version"
          pr_body="WooCommerce $main_version just shipped, so per the [security patch support policy](https://developer.woocommerce.com/docs/contribution/releases/security-support/) (last 21 major versions) the minimum supported version bumps to **$min_version**.

          ---
          _Auto-generated by the \`release-new-release-published.yml\` workflow after $RELEASE_TAG was published._"

          # Update the PR if one is already open for this branch, otherwise create it.
          pr_number=$(gh pr list --head "$branch_name" --json number --jq '.[0].number' 2>/dev/null || echo "")

          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --title "$pr_title" --body "$pr_body"
          else
            gh pr create \
              --title "$pr_title" \
              --body "$pr_body" \
              --base trunk \
              --head "$branch_name" \
              --reviewer "${{ github.actor }}" \
              --label "Release" \
              --milestone "$RELEASE_TAG"
          fi
