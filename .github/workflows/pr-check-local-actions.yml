name: 'Check the local actions'

on:
    pull_request:
        paths:
            - '.github/actions/**'
            - '.github/*.json'
            - '.github/workflows/ci.yml'
            - '.github/workflows/pr-check-local-actions.yml'

permissions:
    contents: read

jobs:
    assign-reviewers:
        name: 'Check the assign-reviewers action'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  sparse-checkout: .github
                  persist-credentials: false

            - name: 'Setup Node'
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: '.nvmrc'

            # Linux only: path.matchesGlob() is case-insensitive elsewhere, so a
            # case-sensitive pattern passes on macOS and Windows when it should not.
            - name: 'Run the checks'
              run: node .github/actions/assign-reviewers/test.js

    local-ci-receipt:
        name: 'Validate local-ci.json'
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - name: Checkout
              uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
              with:
                  sparse-checkout: .github
                  persist-credentials: false

            - name: 'Setup Node'
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
              with:
                  node-version-file: '.nvmrc'

            # The consumer and the tool both read this file; a syntax error or a
            # missing field would silently turn substitution off everywhere.
            - name: 'Validate .github/local-ci.json'
              run: |
                  node -e '
                    const c = JSON.parse( require( "fs" ).readFileSync( ".github/local-ci.json", "utf8" ) );
                    for ( const k of [ "version", "repository", "app", "baseBranch", "receiptPrefix", "plan", "eligible" ] ) {
                      if ( ! ( k in c ) ) throw new Error( "local-ci.json is missing " + k );
                    }
                    if ( c.repository !== process.env.GITHUB_REPOSITORY ) throw new Error( "local-ci.json repository is " + c.repository + ", not " + process.env.GITHUB_REPOSITORY );
                    if ( typeof c.app.appId !== "number" ) throw new Error( "app.appId must be a number" );
                    if ( typeof c.enabled !== "boolean" ) throw new Error( "enabled must be a boolean" );
                    const crypto = require( "crypto" );
                    for ( const r of c.eligible ) {
                      const m = r.prepare && r.prepare.mirrors;
                      if ( ! m ) continue;
                      const actual = crypto.createHash( "sha256" ).update( require( "fs" ).readFileSync( m.action ) ).digest( "hex" );
                      if ( actual !== m.sha256 ) throw new Error( r.type + ": " + m.action + " changed (sha256 " + actual.slice( 0, 12 ) + "…); re-validate its prepare steps and update mirrors.sha256" );
                    }
                    console.log( "local-ci.json ok: enabled=" + c.enabled + ", rules=" + c.eligible.map( ( r ) => r.type ).join( "," ) );
                  '
