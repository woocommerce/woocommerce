name: 'PR experiment: Compressed Size Git filter configuration'

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - '.github/workflows/pr-ci-size-filter-config-probe.yml'

permissions:
  contents: read

concurrency:
  group: pr-size-filter-config-probe-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HEAD_SHA: 918de73f8a3b3d81f9b1fa61aa3716489e5dcf56
  BASE_SHA: 970a1087dd2747f078964aabf4cfdd177081cedc

jobs:
  probe:
    name: 'Git configuration: ${{ matrix.arm }}'
    if: ${{ github.repository == 'woocommerce/woocommerce' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/ci-history-fetch-benchmarks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        arm: [baseline, config-only]
    env:
      ARM: ${{ matrix.arm }}
    steps:
      - name: Checkout historical head without persisting credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      - name: Record initial head and shallow boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "RESULT_DIR=$RUNNER_TEMP/size-config-probe/results" >> "$GITHUB_ENV"
          echo "TRACE_DIR=$RUNNER_TEMP/size-config-probe/traces" >> "$GITHUB_ENV"
          RESULT_DIR="$RUNNER_TEMP/size-config-probe/results"
          TRACE_DIR="$RUNNER_TEMP/size-config-probe/traces"
          mkdir -p "$RESULT_DIR" "$TRACE_DIR"
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          test "$(cat .git/shallow)" = "$HEAD_SHA"
          git rev-parse 'HEAD^{tree}' > "$RESULT_DIR/head-tree.txt"
          git ls-tree -r -z --full-tree "$HEAD_SHA" | sha256sum | cut -d ' ' -f1 > "$RESULT_DIR/head-tree-manifest-sha256.txt"
          cp .git/shallow "$RESULT_DIR/shallow-before.txt"
          git --version > "$RESULT_DIR/git-version.txt"

      - name: Configure the promisor remote
        if: ${{ matrix.arm == 'config-only' }}
        run: |
          git config --local remote.origin.promisor true
          git config --local remote.origin.partialclonefilter blob:none

      - name: Fetch the base using the unchanged action command
        shell: bash
        run: |
          set -euo pipefail
          du -cb .git/objects/pack/*.pack | tail -1 | cut -f1 > "$RESULT_DIR/pack-before.txt"
          started=$(date +%s%N)
          GIT_TRACE_PACKET="$TRACE_DIR/fetch.trace" git fetch -n origin "${BASE_SHA}:size-experiment-base"
          echo "$(( ($(date +%s%N) - started) / 1000000 ))" > "$RESULT_DIR/fetch-ms.txt"
          test "$(git rev-parse size-experiment-base)" = "$BASE_SHA"
          test "$(cat .git/shallow)" = "$HEAD_SHA"
          du -cb .git/objects/pack/*.pack | tail -1 | cut -f1 > "$RESULT_DIR/pack-after-fetch.txt"
          find .git/objects/pack -name '*.promisor' | wc -l > "$RESULT_DIR/promisor-after-fetch.txt"
          git rev-parse 'size-experiment-base^{tree}' > "$RESULT_DIR/base-tree.txt"
          GIT_NO_LAZY_FETCH=1 git ls-tree -r -z --full-tree size-experiment-base | sha256sum | cut -d ' ' -f1 > "$RESULT_DIR/base-tree-manifest-sha256.txt"
          GIT_NO_LAZY_FETCH=1 git rev-list --parents "$BASE_SHA" | LC_ALL=C sort | sha256sum | cut -d ' ' -f1 > "$RESULT_DIR/base-history-sha256.txt"
          GIT_NO_LAZY_FETCH=1 git rev-list --count "$BASE_SHA" > "$RESULT_DIR/base-history-count.txt"

      - name: Check out the base and measure deferred fetches
        shell: bash
        run: |
          set -euo pipefail
          started=$(date +%s%N)
          GIT_TRACE_PACKET="$TRACE_DIR/checkout.trace" git reset --hard size-experiment-base
          echo "$(( ($(date +%s%N) - started) / 1000000 ))" > "$RESULT_DIR/checkout-ms.txt"
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          test "$(cat .git/shallow)" = "$HEAD_SHA"
          du -cb .git/objects/pack/*.pack | tail -1 | cut -f1 > "$RESULT_DIR/pack-after-checkout.txt"
          find .git/objects/pack -name '*.promisor' | wc -l > "$RESULT_DIR/promisor-after-checkout.txt"
          cp .git/shallow "$RESULT_DIR/shallow-after.txt"
          git diff --full-index --binary "$HEAD_SHA" "$BASE_SHA" | sha256sum | cut -d ' ' -f1 > "$RESULT_DIR/binary-diff-sha256.txt"
          git diff --name-only "$HEAD_SHA" "$BASE_SHA" | wc -l > "$RESULT_DIR/changed-path-count.txt"

      - name: Summarize trace evidence without uploading raw packets
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib
          trace = pathlib.Path(os.environ['TRACE_DIR'])
          results = pathlib.Path(os.environ['RESULT_DIR'])
          def packets(name):
              path = trace / name
              return path.read_text() if path.exists() else ''
          fetch, checkout = packets('fetch.trace'), packets('checkout.trace')
          evidence = {
              'arm': os.environ['ARM'],
              'fetch_filter_requests': sum('fetch> filter blob:none' in line for line in fetch.splitlines()),
              'checkout_fetch_requests': sum('fetch> command=fetch' in line for line in checkout.splitlines()),
          }
          results.joinpath('trace-summary.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence))
          PY

      - name: Upload sanitized results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-config-probe-${{ matrix.arm }}-${{ github.run_id }}
          path: ${{ runner.temp }}/size-config-probe/results/
          if-no-files-found: error
          retention-days: 3

  compare:
    name: Compare source and prove implicit filtering
    needs: probe
    if: ${{ !cancelled() && github.repository == 'woocommerce/woocommerce' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'research/ci-history-fetch-benchmarks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download sanitized results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: size-config-probe-*-${{ github.run_id }}
          path: ${{ runner.temp }}/size-config-results

      - name: Require exact source and history equivalence
        env:
          RESULTS: ${{ runner.temp }}/size-config-results
          PROBE_RESULT: ${{ needs.probe.result }}
        shell: bash
        run: |
          python3 <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['RESULTS'])
          folders = {arm: root / f"size-config-probe-{arm}-{os.environ['GITHUB_RUN_ID']}" for arm in ['baseline', 'config-only']}
          failures, lines = [], []
          if os.environ['PROBE_RESULT'] != 'success':
              failures.append('One or more probe jobs failed')
          def read(arm, name):
              try:
                  return (folders[arm] / name).read_text().strip()
              except OSError:
                  failures.append(f'{arm}: missing {name}')
                  return ''
          for name in ['head-tree.txt', 'head-tree-manifest-sha256.txt', 'base-tree.txt', 'base-tree-manifest-sha256.txt', 'base-history-sha256.txt', 'base-history-count.txt', 'binary-diff-sha256.txt', 'changed-path-count.txt', 'shallow-before.txt', 'shallow-after.txt', 'git-version.txt']:
              baseline, candidate = read('baseline', name), read('config-only', name)
              if not baseline or baseline != candidate:
                  failures.append(name + ': missing or different')
              else:
                  lines.append(name + ': ' + baseline)
          for arm in folders:
              if read(arm, 'shallow-before.txt') != os.environ['HEAD_SHA'] or read(arm, 'shallow-after.txt') != os.environ['HEAD_SHA']:
                  failures.append(arm + ': unexpected shallow boundary')
              try:
                  evidence = json.loads(read(arm, 'trace-summary.json'))
                  filtered = evidence['fetch_filter_requests']
                  lazy = evidence['checkout_fetch_requests']
                  markers_fetch = int(read(arm, 'promisor-after-fetch.txt'))
                  markers_checkout = int(read(arm, 'promisor-after-checkout.txt'))
                  if evidence['arm'] != arm or (arm == 'baseline' and (filtered != 0 or lazy != 0)) or (arm == 'config-only' and (filtered < 1 or lazy < 1 or markers_fetch < 1 or markers_checkout <= markers_fetch)):
                      failures.append(arm + ': unexpected filter or lazy-fetch evidence')
                  if int(read(arm, 'base-history-count.txt')) < 2 or int(read(arm, 'changed-path-count.txt')) < 1:
                      failures.append(arm + ': empty history or source difference')
                  costs = {name: int(read(arm, name + '.txt')) for name in ['fetch-ms', 'checkout-ms', 'pack-before', 'pack-after-fetch', 'pack-after-checkout']}
                  lines.append(arm + ': ' + json.dumps({'trace': evidence, 'promisor_after_fetch': markers_fetch, 'promisor_after_checkout': markers_checkout, 'costs': costs}))
              except (ValueError, KeyError, TypeError) as error:
                  failures.append(arm + ': malformed evidence: ' + str(error))
          lines.append('Source and Git integration probe only; no builds or whole-action performance claim.')
          report = '\n'.join(lines + failures) + '\n'
          print(report)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(report)
          if failures:
              raise SystemExit(1)
          PY
