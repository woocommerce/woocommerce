name: 'PR readiness comment'

on:
  workflow_run:
    workflows:
      - 'CI'
      - 'PHPStan Analysis'
      - 'Require milestone on pull requests'
    types:
      - completed

permissions:
  contents: read
  checks: read
  actions: read
  pull-requests: write

concurrency:
  group: pr-readiness-comment-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  update-comment:
    name: 'Update PR readiness comment'
    if: github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # workflow_run already resolves the implicit ref to the default
          # branch, never PR code - stating it explicitly makes that
          # security invariant reviewable instead of an implicit default.
          ref: ${{ github.event.repository.default_branch }}
          # No step here runs git, so the write token has no business
          # persisting in the local git config.
          persist-credentials: false
          sparse-checkout: |
            .github/workflows/scripts

      - name: 'Update PR readiness comment'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const script = require('./.github/workflows/scripts/manage-pr-readiness-comment.js');
            await script({ github, context, core });
