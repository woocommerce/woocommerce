name: Test canonical extensions

on:
  pull_request:
  workflow_dispatch:
    inputs:
      woocommerce_version:
        description: 'WooCommerce version to use for testing (see https://qit.woo.com/wp-json/cd/v1/environment)?'
        required: true
      wordpress_version:
        description: 'WordPress version to use for testing (see https://qit.woo.com/wp-json/cd/v1/environment)?'
        required: false
        default: ''
      php_version:
        description: 'PHP version to use for testing (see https://qit.woo.com/wp-json/cd/v1/environment)?'
        required: false
        default: ''

jobs:
  run-tests:
    name: Test canonical extensions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Setup PNPM
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0

      - name: Run target repositories testing workflows
        env:
            REPOSITORIES: ${{ env.CANONICAL_EXTENSIONS }}
            GH_TOKEN: ${{ secrets.PR_ASSIGN_TOKEN }}
            GH_REPO: ${{ github.repository }}
        run: |
            exit 1
          
            printf "9.9.0-rc.1\n\n\n$REPOSITORIES\n" | pnpm run-canonical-extensions-tests
