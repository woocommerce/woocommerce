name: 'Look for a local CI receipt'
description: 'Decides whether a `gh local-ci` receipt on the pull request head lets this job skip its install and test steps. Anything short of a verified, passing receipt yields `substituted=false` with a reason. See README.md.'

inputs:
  job-name:
    description: 'The matrix job name. The receipt is the check run named `receiptPrefix + job-name`.'
    required: true
  github-token:
    description: 'Needs `contents: read` and `checks: read`; the default `github.token` has both.'
    required: true
  disabled:
    description: 'Pass the `LOCAL_CI_RECEIPTS_DISABLED` repository variable; `1` disables substitution.'
    required: false
    default: ''

outputs:
  substituted:
    description: '`true` when the install and test steps may be skipped.'
    value: ${{ steps.lookup.outputs.substituted }}
  reason:
    description: 'Why.'
    value: ${{ steps.lookup.outputs.reason }}

runs:
  using: 'composite'
  steps:
    - name: Look up the receipt
      id: lookup
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        JOB_NAME: ${{ inputs.job-name }}
        DISABLED: ${{ inputs.disabled }}
        SCRIPT: ${{ github.action_path }}/receipt.js
      with:
        github-token: ${{ inputs.github-token }}
        retries: 2
        script: |
          await require( process.env.SCRIPT ).lookup( { github, context, core } );
