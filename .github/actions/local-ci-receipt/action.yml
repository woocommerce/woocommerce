name: 'Look for a local CI receipt'
description: 'Decides whether a `gh local-ci` receipt on the pull request head lets this job skip its install and test steps. Anything short of a verified, passing receipt yields `substituted=false` with a reason. With `ci-outcome`, it instead compares CI''s result with the receipt''s. See README.md.'

inputs:
  job-name:
    description: 'The matrix job name. The receipt is the check run named `receiptPrefix + job-name`.'
    required: true
  github-token:
    description: 'Needs `contents: read` and `checks: read`; the default `github.token` has both.'
    required: true
  disabled:
    description: 'Pass the `LOCAL_CI_RECEIPTS_DISABLED` repository variable; `1` disables substitution.'
    required: false
    default: ''
  ci-outcome:
    description: 'Set after the tests to compare: the `Run tests` step outcome. Empty runs the lookup.'
    required: false
    default: ''
  parity:
    description: 'With `ci-outcome`: the lookup step''s `parity` output.'
    required: false
    default: ''

outputs:
  substituted:
    description: '`true` when the install and test steps may be skipped.'
    value: ${{ steps.lookup.outputs.substituted }}
  reason:
    description: 'Why.'
    value: ${{ steps.lookup.outputs.reason }}
  parity:
    description: 'Set when CI runs the job and its result can be compared with the receipt''s (a sampled job, or a failed receipt); pass it to the comparison step.'
    value: ${{ steps.lookup.outputs.parity }}

runs:
  using: 'composite'
  steps:
    - name: Look up the receipt
      id: lookup
      if: ${{ inputs.ci-outcome == '' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        JOB_NAME: ${{ inputs.job-name }}
        DISABLED: ${{ inputs.disabled }}
        SCRIPT: ${{ github.action_path }}/receipt.js
      with:
        github-token: ${{ inputs.github-token }}
        retries: 2
        script: |
          await require( process.env.SCRIPT ).lookup( { github, context, core } );

    - name: Compare with the receipt
      if: ${{ inputs.ci-outcome != '' }}
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        JOB_NAME: ${{ inputs.job-name }}
        PARITY: ${{ inputs.parity }}
        CI_OUTCOME: ${{ inputs.ci-outcome }}
        SCRIPT: ${{ github.action_path }}/receipt.js
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          await require( process.env.SCRIPT ).report( { core } );
