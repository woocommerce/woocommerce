reviews:
    assess_linked_issues: false
    collapse_walkthrough: true
    high_level_summary: false
    review_status: false
    suggested_labels: false
    suggested_reviewers: false
    poem: false
    path_instructions:
    - path: '**/*.{php,js,ts,jsx,tsx}'
      instructions: |
        Don't trust that extension developers will follow the best practices, make sure the code:
        - Guards against unexpected inputs.
        - Sanitizes and validates any potentially dangerous inputs.
        - Is backwards compatible.
        - Is readable and intuitive.
        - Has unit or E2E tests where applicable.
        Treat any change to a public or externally exposed class, interface, function, or method signature as high-risk,
        regardless of whether it lives in the `Internal` namespace — third-party code implements and consumes some of
        these contracts in practice. Flag such changes and ask the author to state the backwards-compatibility impact in
        the PR description. Call out explicitly when a method is added to an interface that external code can implement:
        this is a backwards-incompatible change because existing implementers fatal on load (e.g. WooCommerce 10.9.0 was
        reverted on WP Cloud after a required method was added to `FeedInterface`). Suggest a non-breaking alternative
        such as adding the method to a concrete class, introducing a new interface, or providing a default via an
        abstract base class. For renames or removals of existing public symbols, follow the deprecate-don't-rename
        policy: keep the original symbol with an `@deprecated` notice pointing to the replacement, rather than changing
        it in place.
        When making any changes to code that deletes or modifies orders/products/customer data, make sure that there are
        sufficient checks in place to prevent accidental data loss. As an example, if deleting a draft order, check that
        the order status is indeed `draft` or `checkout-draft`. Also think about whether race conditions could occur and
        delete orders that don't belong to the current customer. When in doubt, ask for clarification in the PR comments.
    - path: '**/*.{js,jsx,ts,tsx,css,scss}'
      instructions: |
        For UI changes, check that the code follows the WordPress Design System (WPDS). Only flag concrete deviations
        and skip this check for changes that don't touch UI.
        Components:
        - Don't hand-roll a component that `@wordpress/ui` or `@wordpress/components` already provides (Card, Badge,
          Notice, Tooltip, Popover, Modal, Tabs, VisuallyHidden, etc.).
        - Prefer `@wordpress/ui` and `@wordpress/components` over `@woocommerce/components` when the component is
          already available in those packages.
        - Prefer `@wordpress/ui` primitives over custom CSS or raw elements: `Stack` instead of `display: flex` and
          gap/margin layouts, `Text` instead of `p` or headings with custom font styles, `Link` instead of `a`.
        Styling:
        - Use `--wpds-*` tokens instead of fixed hex colors, pixel font sizes, radii, or motion values. Pick the token
          closest in semantic role (not just the nearest hex value) and make sure it exists in the installed
          `@wordpress/theme`.
        - Don't add legacy Sass color variables or `--wp-admin-*` tokens. Use the `--wpds-*` equivalent. Legacy
          variables include the `@automattic/color-studio` and `@wordpress/base-styles` palettes (`$gray-700`,
          `$studio-*`, `$alert-red`, `$white`) and the shared admin colors in
          `packages/js/internal-build/styles/_colors.scss` (`$gray-text`, `$gray-text-hover`, `$valid-green`,
          `$notice-yellow`, `$error-red`, `$core-orange`).
        - Don't heavily override component styles, or restyle a component with CSS to get a variant. Use a
          component's props instead when one exists (e.g. a font size prop on `Text` rather than CSS). Position,
          width, and margin additions are fine because they don't change the component's appearance. If an override
          only preserves old visuals, or stacks on another override, ask whether it is needed or whether the shared
          component should change.
        - Don't target internal `.component-*` or other `@wordpress/components` class names. They aren't stable.
        - If a WPDS component seems to misbehave, suspect a CSS reset or specificity conflict before accepting a local
          workaround.
        - If a workaround is needed because a WPDS component lacks a capability, it is acceptable as a temporary
          measure. Ask for a code comment linking the upstream issue (e.g. in WordPress/gutenberg) so it reads as a
          deliberate workaround that can be removed once the issue is fixed.
        Copy:
        - Button and label text uses sentence case ("Edit form", not "Edit Form").
